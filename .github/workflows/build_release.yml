name: Build & Release DeskBuddy Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm DeskBuddy.spec

      - name: Package Standalone Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DeskBuddy/* -DestinationPath dist/DeskBuddy-Windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/DeskBuddy-Windows-x64.zip
          generate_release_notes: true
          name: DeskBuddy Release ${{ github.ref_name }}
          draft: false
          prerelease: false
